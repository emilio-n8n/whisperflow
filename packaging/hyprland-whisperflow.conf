# WhisperFlow — inclus depuis ~/.config/hypr/hyprland.conf par :
#   source = ~/.config/hypr/whisperflow.conf
# Vérifie les conflits : hyprctl binds | grep -i -A3 "modmask: 68"

# SUPER+CTRL+D/E sont utilisés par les menus Display/Emojis d'Omarchy : on les reprend.
unbind = SUPER CTRL, D
unbind = SUPER CTRL, E

# Niveau 1 — dictée : 1 appui écoute, 2e appui tape le texte
bind = SUPER CTRL, D, exec, whisperflow toggle
# Niveau 2 — commande vocale : 1 appui écoute, 2e appui exécute (« ouvre Firefox », « bureau 2 »…)
bind = SUPER CTRL, E, exec, whisperflow command
# Niveau 3 — conversation Gemini Live (voix + écran) : démarre / arrête
bind = SUPER CTRL, G, exec, whisperflow live toggle
# Annuler l'enregistrement ou la transcription en cours
bind = SUPER CTRL, X, exec, whisperflow cancel
# Arrêt d'urgence : coupe Gemini, les agents OpenCode, l'enregistrement et les minuteurs
bind = SUPER CTRL, Escape, exec, whisperflow panic

# Lien iPhone temporaire (Cloudflare) : démarre/arrête, l'URL arrive en notification
bind = SUPER ALT, R, exec, whisperflow remote

# Mode maintien pour la dictée (option) : remplace la 1re ligne par ces deux-là
# bind  = SUPER CTRL, D, exec, whisperflow start
# bindr = SUPER CTRL, D, exec, whisperflow stop
